# =========================================================================
# FractalNova-Core · pretraining DA ZERO (~124M) · RTX 5060 Ti 16GB
# =========================================================================
# Questo modello e' addestrato da inizializzazione random: e' il tuo nucleo
# proprietario. Piccolo per scelta fisica (1 GPU): impara bene 1-2 lingue,
# NON e' un poliglotta a livello umano (quello e' il compito di FractalNova-Pro).

# --- Dati (prodotti da prepare_corpus.py) ---
data_dir: "training/pretrain/artifacts"   # contiene train.bin, val.bin, meta.json, tokenizer.json

# --- Architettura ---
n_layer: 12
n_head: 12
n_embd: 768
block_size: 8192             # contesto illimitato per libri interi
dropout: 0.0
bias: false
rope_theta: 10000.0

# --- Training (numeri scelti per ~16GB) ---
out_dir: "training/pretrain/outputs/core-124m"
init_from: "scratch"            # "scratch" | "resume"
batch_size: 6                   # micro-batch
gradient_accumulation_steps: 10 # token effettivi/step = 6 * 10 * 1024 = ~61k
max_iters: 50000
warmup_iters: 1000
lr_decay_iters: 50000
learning_rate: 0.0006
min_lr: 0.00006
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
eval_interval: 500
eval_iters: 100
log_interval: 10
compile: false                  # metti true se torch.compile e' stabile sul tuo setup
dtype: "bfloat16"
seed: 1337
